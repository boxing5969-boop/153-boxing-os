name = "153-boxing-os-api"
main = "src/index.ts"
compatibility_date = "2026-04-28"
# @sentry/cloudflare 가 node:async_hooks 를 사용
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
PAGES_URL = "https://153-boxing-os.pages.dev"

# 시크릿은 wrangler secret put 으로 등록 (평문 저장 금지)
# 또는 로컬 개발 시 workers/api/.dev.vars 파일에 KEY=VALUE 형식으로 저장 (gitignored)
#
# 필수 시크릿:
# - SUPABASE_URL                  : Settings → API → Project URL
# - SUPABASE_SERVICE_ROLE_KEY     : Settings → API → service_role
# - SUPABASE_JWT_SECRET           : Settings → API → JWT Secret
# - QR_SIGNING_SECRET             : 임의의 32+ 바이트 (openssl rand -base64 32)
# - DEVICE_API_KEY                : 단말기 공용 HMAC 키 (Phase 8 에서 per-device 로 전환)
#
# 선택 시크릿 — 카카오 알림톡 (Solapi):
# - SOLAPI_API_KEY                : Solapi 콘솔 → API Key
# - SOLAPI_API_SECRET             : Solapi 콘솔 → API Secret
# - SOLAPI_SENDER_KEY             : 카카오 채널 pfId (KA01PF...)
# - SENDER_PHONE                  : 발신 번호 (하이픈 없이, 예: 15991999)
# - KAKAO_EXPIRY_TPL_D7           : D-7 알림톡 템플릿 ID (KA01TP...)
# - KAKAO_EXPIRY_TPL_D3           : D-3 알림톡 템플릿 ID
# - KAKAO_EXPIRY_TPL_D1           : D-1 알림톡 템플릿 ID
#
# 선택 시크릿 — FC AI 메시지 생성:
# - ANTHROPIC_API_KEY             : Anthropic 콘솔 API Key (미설정 시 규칙 기반 폴백)

[dev]
port = 8787

# Cron Triggers (무료 플랜 최대 5개)
# - 매분: device_sync_jobs 처리 (50개 batch)
# - 매 5분: 사고 알림 체크 (단말기 오프라인/오류/sync 누적)
# - 매 10분: qr_used_tokens 만료 정리
# - 매일 00:05 KST (15:05 UTC): 만료 일괄 처리 + 알림톡 + 일일 리포트 SMS
# - 매시간 정각: 예약 발송 처리
[triggers]
crons = [
  "* * * * *",
  "*/5 * * * *",
  "*/10 * * * *",
  "5 15 * * *",
  "0 * * * *"
]
