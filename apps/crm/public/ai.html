<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>153 Boxing OS · AI 도우미</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand: #e63027;
      --brand-dark: #b71c1c;
      --bg: #0f0f10;
      --surface: #1a1a1d;
      --surface2: #232327;
      --border: #2e2e33;
      --text: #f0f0f2;
      --text-muted: #888890;
      --user-bubble: #e63027;
      --bot-bubble: #232327;
      --radius: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header-logo {
      width: 36px; height: 36px;
      background: var(--brand);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 900; color: #fff; letter-spacing: -0.5px;
      flex-shrink: 0;
    }
    .header-info h1 { font-size: 15px; font-weight: 800; }
    .header-info p { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 2px rgba(34,197,94,.25);
      animation: pulse 2s infinite;
      margin-left: auto; flex-shrink: 0;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    /* ── Messages ───────────────────────────────────── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg { display: flex; gap: 10px; max-width: 88%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }

    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0; margin-top: 2px;
      background: var(--brand); color: #fff; font-weight: 900;
    }
    .msg.user .avatar { background: #3a3a40; font-size: 14px; }

    .bubble {
      padding: 11px 15px;
      border-radius: var(--radius);
      font-size: 13.5px;
      line-height: 1.65;
      word-break: keep-all;
    }
    .msg.bot .bubble {
      background: var(--bot-bubble);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border);
    }
    .msg.user .bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
      color: #fff;
    }
    .bubble strong { font-weight: 700; }
    .bubble ul { padding-left: 18px; margin-top: 6px; }
    .bubble li { margin-bottom: 4px; }
    .bubble .tag {
      display: inline-block;
      background: rgba(230,48,39,.15);
      color: var(--brand);
      border-radius: 6px;
      padding: 1px 7px;
      font-size: 11px;
      font-weight: 600;
      margin-right: 4px;
      margin-bottom: 2px;
    }

    /* ── Typing indicator ───────────────────────────── */
    .typing .bubble {
      display: flex; align-items: center; gap: 5px;
      padding: 14px 18px;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-muted);
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

    /* ── Quick chips ────────────────────────────────── */
    .chips-wrap {
      padding: 0 16px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      flex-shrink: 0;
    }
    .chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 13px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .chip:hover { border-color: var(--brand); color: var(--brand); background: rgba(230,48,39,.07); }

    /* ── Input ──────────────────────────────────────── */
    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .input-row input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color .15s;
    }
    .input-row input::placeholder { color: var(--text-muted); }
    .input-row input:focus { border-color: var(--brand); }
    .send-btn {
      width: 40px; height: 40px;
      background: var(--brand);
      border: none; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .15s;
      flex-shrink: 0;
    }
    .send-btn:hover { background: var(--brand-dark); }
    .send-btn:disabled { background: var(--surface2); cursor: not-allowed; }
    .send-btn svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; }

    /* ── Intro card ─────────────────────────────────── */
    .intro {
      background: linear-gradient(135deg, rgba(230,48,39,.12), rgba(183,28,28,.06));
      border: 1px solid rgba(230,48,39,.25);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 4px;
    }
    .intro h2 { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
    .intro p { font-size: 12.5px; color: var(--text-muted); line-height: 1.6; }

    @media(max-width:480px) {
      .bubble { font-size: 13px; }
      .msg { max-width: 95%; }
    }
  </style>
</head>

<!-- Header -->
<div class="header">

    <h1>153 Boxing OS AI</h1>
    <p>무엇이든 물어보세요</p>
  </div>

<!-- Messages -->
<div class="messages" id="msgs"></div>

<!-- Quick chips -->
<div class="chips-wrap" id="chips"></div>

<!-- Input -->
<div class="input-row">

  <button class="send-btn" id="sendBtn" onclick="handleSend()">

// Fuse.js 초기화
// ════════════════════════════════════════════════════
const fuse = new Fuse(KB, {
  keys: [
    { name: 'q',    weight: 0.4 },
    { name: 'tags', weight: 0.6 },
  ],
  threshold: 0.45,
  includeScore: true,
  minMatchCharLength: 1,
});

// ════════════════════════════════════════════════════
// 빠른 질문 칩
// ════════════════════════════════════════════════════
const QUICK = [
  "이 앱이 뭔가요?",
  "출입통제 어떻게 작동?",
  "이용권 관리",
  "프랜차이즈 구조",
  "보안은 안전한가요?",
  "비용이 얼마예요?",
  "설문 기능",
  "문자 발송",
];

// ════════════════════════════════════════════════════
// 폴백 응답
// ════════════════════════════════════════════════════
const FALLBACKS = [
  "죄송해요, 정확히 이해하지 못했어요. 다른 방식으로 질문해주시겠어요? 예: <strong>출입통제</strong>, <strong>이용권 관리</strong>, <strong>프랜차이즈 구조</strong> 등을 물어보실 수 있어요.",
  "제가 그 질문에 대한 정보를 찾지 못했어요. 아래 빠른 질문을 눌러보시거나, 더 구체적으로 질문해주세요.",
  "음… 잘 모르겠어요. <strong>도입 문의</strong>나 <strong>기능 설명</strong> 관련해서 다시 질문해주시면 도와드릴게요!",
];

// ════════════════════════════════════════════════════
// UI 유틸
// ════════════════════════════════════════════════════
const msgsEl  = document.getElementById('msgs');
const inpEl   = document.getElementById('inp');
const chipsEl = document.getElementById('chips');
let   busy    = false;

function renderChips(show = true) {
  chipsEl.innerHTML = '';
  if (!show) return;
  QUICK.forEach(text => {
    const c = document.createElement('button');
    c.className = 'chip';
    c.textContent = text;
    c.onclick = () => { inpEl.value = text; handleSend(); };
    chipsEl.appendChild(c);
  });
}

function addMsg(html, role) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;

  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = role === 'bot' ? '🤖' : '나';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = html;

  wrap.appendChild(av);
  wrap.appendChild(bubble);
  msgsEl.appendChild(wrap);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  return wrap;
}

function showTyping() {
  const el = addMsg('', 'bot typing');
  el.querySelector('.bubble').innerHTML =
    '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  return el;
}

function answer(query) {
  const results = fuse.search(query);
  if (results.length === 0 || results[0].score > 0.6) {
    return FALLBACKS[Math.floor(Math.random() * FALLBACKS.length)];
  }
  // 최고 점수 항목 반환
  return results[0].item.a;
}

async function handleSend() {
  const q = inpEl.value.trim();
  if (!q || busy) return;
  busy = true;
  inpEl.value = '';
  renderChips(false);

  addMsg(q, 'user');

  const typingEl = showTyping();

  // 짧은 지연으로 자연스러운 응답감
  await new Promise(r => setTimeout(r, 600 + Math.random() * 400));
  typingEl.remove();

  const resp = answer(q);
  addMsg(resp, 'bot');

  busy = false;
  renderChips(true);
  inpEl.focus();
}

// Enter 키 처리
inpEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') handleSend();
});

  `;
  msgsEl.appendChild(intro);

  addMsg(
    '안녕하세요! 저는 <strong>153 Boxing OS</strong> 전용 AI 도우미예요. 🥊<br><br>출입통제 시스템, 회원·이용권 관리, 프랜차이즈 구조, 각종 기능에 대해 자세히 알려드릴 수 있어요. 아래 빠른 질문을 눌러보거나 직접 입력해보세요!',
    'bot'
  );
  renderChips(true);
  inpEl.focus();
})();
</script>
