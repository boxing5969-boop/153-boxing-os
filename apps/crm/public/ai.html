<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>153 Boxing OS · AI 도우미</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand: #e63027;
      --brand-dark: #b71c1c;
      --bg: #0f0f10;
      --surface: #1a1a1d;
      --surface2: #232327;
      --border: #2e2e33;
      --text: #f0f0f2;
      --text-muted: #888890;
      --radius: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header-logo {
      width: 36px; height: 36px;
      background: var(--brand);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 900; color: #fff;
      flex-shrink: 0;
    }
    .header-info h1 { font-size: 15px; font-weight: 800; }
    .header-info p  { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 2px rgba(34,197,94,.25);
      animation: pulse 2s infinite;
      margin-left: auto;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg { display: flex; gap: 10px; max-width: 90%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }

    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0; margin-top: 2px;
      background: var(--brand); color: #fff; font-weight: 900;
    }
    .msg.user .avatar { background: #3a3a40; }

    .bubble {
      padding: 11px 15px;
      border-radius: var(--radius);
      font-size: 13.5px;
      line-height: 1.65;
      word-break: keep-all;
    }
    .msg.bot .bubble {
      background: var(--surface2);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border);
    }
    .msg.user .bubble {
      background: var(--brand);
      border-bottom-right-radius: 4px;
      color: #fff;
    }
    .bubble ul { padding-left: 18px; margin-top: 6px; }
    .bubble li { margin-bottom: 4px; }
    .bubble .tag {
      display: inline-block;
      background: rgba(230,48,39,.15);
      color: var(--brand);
      border-radius: 6px;
      padding: 1px 7px;
      font-size: 11px;
      font-weight: 600;
      margin-right: 4px;
      margin-bottom: 2px;
    }

    .typing .bubble {
      display: flex; align-items: center; gap: 5px;
      padding: 14px 18px;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-muted);
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

    .chips-wrap {
      padding: 0 16px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      flex-shrink: 0;
    }
    .chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 13px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .chip:hover { border-color: var(--brand); color: var(--brand); background: rgba(230,48,39,.07); }

    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .input-row input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color .15s;
    }
    .input-row input::placeholder { color: var(--text-muted); }
    .input-row input:focus { border-color: var(--brand); }
    .send-btn {
      width: 40px; height: 40px;
      background: var(--brand);
      border: none; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .15s;
      flex-shrink: 0;
    }
    .send-btn:hover { background: var(--brand-dark); }
    .send-btn svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; }

    .intro {
      background: linear-gradient(135deg, rgba(230,48,39,.12), rgba(183,28,28,.06));
      border: 1px solid rgba(230,48,39,.25);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .intro h2 { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
    .intro p  { font-size: 12.5px; color: var(--text-muted); line-height: 1.6; }

    @media(max-width:480px) {
      .bubble { font-size: 13px; }
      .msg { max-width: 96%; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-logo">153</div>
  <div class="header-info">
    <h1>153 Boxing OS AI</h1>
    <p>무엇이든 물어보세요</p>
  </div>
  <div class="status-dot"></div>
</div>

<div class="messages" id="msgs"></div>
<div class="chips-wrap" id="chips"></div>

<div class="input-row">
  <input type="text" id="inp" placeholder="궁금한 점을 입력하세요…" autocomplete="off" />
  <button class="send-btn" onclick="handleSend()">
    <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
  </button>
</div>

    a: `<strong>153 Boxing OS</strong>는 153복싱짐 전국 프랜차이즈 전용 통합 운영 플랫폼입니다.<br><br>단순 회원관리가 아닌 <strong>CRM + 출입통제 + HR + 재무 + 설문</strong>을 하나로 묶은 복싱짐 전용 OS입니다.<br><ul>

    a: `출입 판단은 <strong>153 CRM 서버</strong>가 합니다. 얼굴인식 단말기는 "누구인지"만 확인하고, CRM이 "들어와도 되는지"를 결정합니다.<br><br>

    필터 기능:

// ════════════════════════════════════════════════════
// 검색 엔진 (1차: 키워드 직접매칭 / 2차: 편집거리)
// ════════════════════════════════════════════════════
function normalize(s) {
  return s.toLowerCase().replace(/\s+/g, '');
}

function keywordScore(item, query) {
  const q = normalize(query);
  let best = 0;
  for (const k of item.keys) {
    const kn = normalize(k);
    if (q === kn) { best = 1; break; }
    if (q.includes(kn) || kn.includes(q)) {
      const score = Math.min(k.length, query.length) / Math.max(k.length, query.length);
      if (score > best) best = score;
    }
  }
  return best;
}

// 두 문자열 편집거리 (Levenshtein) — 짧은 쿼리용
function editDist(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length: m+1}, (_, i) => Array.from({length: n+1}, (_, j) => i ? j ? 0 : j : i));
  for (let i=1;i<=m;i++) for (let j=1;j<=n;j++)
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  return dp[m][n];
}

function fuzzyScore(item, query) {
  const q = normalize(query);
  let best = 0;
  for (const k of item.keys) {
    const kn = normalize(k);
    const maxLen = Math.max(kn.length, q.length);
    if (maxLen === 0) continue;
    const dist = editDist(q, kn);
    const score = 1 - dist / maxLen;
    if (score > best) best = score;
  }
  return best;
}

function answer(query) {
  if (!query.trim()) return null;

  // 1차: 키워드 직접 매칭
  let best = null, bestScore = 0;
  for (const item of KB) {
    const s = keywordScore(item, query);
    if (s > bestScore) { bestScore = s; best = item; }
  }
  if (bestScore >= 0.35) return best.a;

  // 2차: 편집거리 퍼지 매칭
  bestScore = 0; best = null;
  for (const item of KB) {
    const s = fuzzyScore(item, query);
    if (s > bestScore) { bestScore = s; best = item; }
  }
  if (bestScore >= 0.55) return best.a;

  return null; // 폴백
}

// UI
// ════════════════════════════════════════════════════
const msgsEl  = document.getElementById('msgs');
const inpEl   = document.getElementById('inp');
const chipsEl = document.getElementById('chips');
let   busy    = false;

function renderChips(show) {
  chipsEl.innerHTML = '';
  if (!show) return;
  QUICK.forEach(text => {
    const c = document.createElement('button');
    c.className = 'chip';
    c.textContent = text;
    c.onclick = () => { inpEl.value = text; handleSend(); };
    chipsEl.appendChild(c);
  });
}

function addMsg(html, role) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;

  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = role === 'bot' ? '🤖' : '나';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = html;

  wrap.appendChild(av);
  wrap.appendChild(bubble);
  msgsEl.appendChild(wrap);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  return wrap;
}

function showTyping() {
  const el = addMsg('', 'bot typing');
  el.querySelector('.bubble').innerHTML =
    '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  return el;
}

async function handleSend() {
  const q = inpEl.value.trim();
  if (!q || busy) return;
  busy = true;
  inpEl.value = '';
  renderChips(false);

  addMsg(q, 'user');
  const typingEl = showTyping();
  await new Promise(r => setTimeout(r, 500 + Math.random() * 300));
  typingEl.remove();

  const resp = answer(q) ?? FALLBACKS[Math.floor(Math.random() * FALLBACKS.length)];
  addMsg(resp, 'bot');

  busy = false;
  renderChips(true);
  inpEl.focus();
}

inpEl.addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });
